<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate News App</title>

<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<style>
:root {
  --bg: linear-gradient(135deg, #0f172a, #1e293b);
  --card: rgba(30, 41, 59, 0.6);
  --text: #e2e8f0;
  --accent: #7c3aed;
  --accent2: #22d3ee;
}

body.light {
  --bg: linear-gradient(135deg, #e0f2fe, #f8fafc);
  --card: rgba(255, 255, 255, 0.7);
  --text: #0f172a;
  --accent: #6366f1;
  --accent2: #06b6d4;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.4s ease;
}

/* Header */
header {
  text-align: center;
  padding: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Input */
input {
  padding: 12px;
  width: 50%;
  border-radius: 25px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: var(--text);
}

/* Buttons */
button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* Grid */
.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

/* Cards */
.card {
  background: var(--card);
  border-radius: 20px;
  overflow: hidden;
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* Content */
.card-content {
  padding: 15px;
}

.card-content h3 {
  margin-bottom: 10px;
}

/* Links */
a {
  color: var(--accent2);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Highlight */
.highlight {
  background: linear-gradient(135deg, #facc15, #f97316);
  color: black;
  padding: 2px 4px;
  border-radius: 4px;
}

/* Loader */
.loader {
  text-align: center;
  padding: 20px;
  font-size: 18px;
  opacity: 0.8;
}

/* Recent searches */
.recent span {
  cursor: pointer;
  margin: 5px;
  padding: 6px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg, #64748b, #334155);
  color: white;
  font-size: 12px;
}

/* Mobile */
@media(max-width:500px){
  input{
    width:70%;
  }
}


</style>
</head>

<body>

<header>
<h2>📰 Ultimate News App</h2>

<input type="text" id="query" placeholder="Search news...">
<button onclick="toggleTheme()">🌙 Mode</button>

<div>
<button onclick="setCategory('general')">General</button>
<button onclick="setCategory('technology')">Tech</button>
<button onclick="setCategory('sports')">Sports</button>
<button onclick="setCategory('business')">Business</button>
</div>

<div class="recent" id="recent"></div>
</header>

<div class="loader" id="loader"></div>
<div class="container" id="news"></div>

<button onclick="loadMore()" style="display:block;margin:20px auto;">
Load More
</button>

<script>
const API_KEY = "76d24f87f68092a887e65e218ec2ed9c";

let page = 1;
let currentQuery = "india";
let currentCategory = "general";
let debounceTimer;

// 🔥 Highlight function
function highlight(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp(`(${keyword})`, "gi");
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

// 🔥 Save recent searches
function saveSearch(query) {
  let searches = JSON.parse(localStorage.getItem("searches")) || [];
  if (!searches.includes(query)) {
    searches.unshift(query);
    if (searches.length > 5) searches.pop();
    localStorage.setItem("searches", JSON.stringify(searches));
  }
  renderRecent();
}

function renderRecent() {
  const container = document.getElementById("recent");
  const searches = JSON.parse(localStorage.getItem("searches")) || [];
  container.innerHTML = searches.map(s => 
    `<span onclick="useRecent('${s}')">${s}</span>`
  ).join("");
}

function useRecent(q) {
  document.getElementById("query").value = q;
  currentQuery = q;
  fetchNews(true);
}

// 🔥 Fetch news
async function fetchNews(reset=false) {
  if (reset) {
    document.getElementById("news").innerHTML="";
    page=1;
  }

  document.getElementById("loader").innerText="Loading...";

  try {
    const res = await fetch(
      `https://gnews.io/api/v4/top-headlines?category=${currentCategory}&q=${currentQuery}&lang=en&page=${page}&apikey=${API_KEY}`
    );
    const data = await res.json();

    document.getElementById("loader").innerText="";

    data.articles.forEach(article=>{
      const card=document.createElement("div");
      card.className="card";

      card.innerHTML=`
        <img src="${article.image || ''}">
        <div class="card-content">
          <h3>${highlight(article.title,currentQuery)}</h3>
          <p>${highlight(article.description || '',currentQuery)}</p>
          <a href="${article.url}" target="_blank">Read more →</a>
        </div>
      `;
      document.getElementById("news").appendChild(card);
    });

  } catch {
    document.getElementById("loader").innerText="Error loading news";
  }
}

// 🔥 Debounce typing
function debounceSearch(value){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>{
    if(value.length<2) return;
    currentQuery=value;
    saveSearch(value);
    fetchNews(true);
  },500);
}

// 🔥 Category
function setCategory(cat){
  currentCategory=cat;
  fetchNews(true);
}

// 🔥 Pagination
function loadMore(){
  page++;
  fetchNews();
}

// 🔥 Theme toggle
function toggleTheme(){
  document.body.classList.toggle("light");
}

// 🔥 Input listener
document.getElementById("query").addEventListener("input",(e)=>{
  debounceSearch(e.target.value);
});

// Init
renderRecent();
fetchNews();
</script>

</body>
</html>
